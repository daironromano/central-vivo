<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centralizador Diário de Relatórios — Vivo</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="topbar">
    <div class="brand" onclick="trocarAba('resumo')" title="Voltar para a Página Inicial">
      <div class="brand-logo">
        <svg class="icon-vivo" style="width:22px;height:22px;" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 7.5l-6-3 6-3 6 3-6 3zm0 2.5l-10-5v2l10 5 10-5v-2l-10 5zm0 5l-10-5v2l10 5 10-5v-2l-10 5z"/>
        </svg>
      </div>
      <h1>Centralizador Diário de Relatórios — Vivo</h1>
    </div>

    <div class="top-actions">
      <span id="lastUpdateTop" class="last-update-top"></span>
      <button type="button" id="userBadge" class="user-badge" onclick="abrirModalUsuarios()" title="Perfis e Usuários">
        USUÁRIO
      </button>
      <button class="btn btn-secondary" onclick="extrairTodos()" id="btnExtractAll">
        <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        <span>Sincronizar Fontes</span>
      </button>
      <button class="btn btn-primary" onclick="baixarExcelUnificado()" id="btnDownloadExcel">
        <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span>Baixar Excel</span>
      </button>
      <button class="btn btn-secondary" onclick="encerrarSessao()" title="Sair">
        <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        <span>Sair</span>
      </button>
    </div>
  </header>

  <!-- NAVEGAÇÃO DE ABAS -->
  <nav class="tabs-bar">
    <div class="tabs-left">
      <button class="tab-btn active" onclick="trocarAba('resumo')" id="tabbtn-resumo">
        <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span>Resumo Executivo</span>
      </button>
      <button class="tab-btn" onclick="trocarAba('p1_domus')" id="tabbtn-p1_domus">
        <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        <span>P1</span>
        <span class="tab-counter" id="count-p1_domus">0</span>
      </button>
      <button class="tab-btn" onclick="trocarAba('anel_comutado')" id="tabbtn-anel_comutado">
        <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        <span>AnelComutado</span>
        <span class="tab-counter" id="count-anel_comutado">0</span>
      </button>
      <button class="tab-btn" onclick="trocarAba('celldowntime')" id="tabbtn-celldowntime">
        <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span>CellDowntime</span>
        <span class="tab-counter" id="count-celldowntime">0</span>
      </button>
    </div>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container">
    <!-- RESUMO EXECUTIVO -->
    <section id="panel-resumo" class="tab-panel active">
      <div class="kpi-grid" id="kpiGrid"></div>

      <div class="summary-grid">
        <div class="card">
          <div class="card-header">
            <span class="card-title">
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
              <span>Matriz Consolidada por UF</span>
            </span>
          </div>
          <div class="table-wrapper" id="tabelaRegionalResumo"></div>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M16 11V5h2V3H6v2h2v6l-2 2v2h5v6l1 1 1-1v-6h5v-2l-2-2z"/></svg>
              <span>Detalhamento Operacional</span>
            </span>
          </div>
          <div id="statusBreakdownResumo"></div>
        </div>
      </div>
    </section>

    <!-- ABAS INDIVIDUAIS DOS 3 RELATÓRIOS -->
    <section id="panel-p1_domus" class="tab-panel"></section>
    <section id="panel-anel_comutado" class="tab-panel"></section>
    <section id="panel-celldowntime" class="tab-panel"></section>
  </main>

  <!-- MODAL DE PERFIS E USUÁRIOS (AO CLICAR NO BOTÃO DO USUÁRIO) -->
  <div id="modalUsuarios" class="modal-overlay" onclick="fecharModalFora(event)">
    <div class="modal-card">
      <div class="card-header">
        <span class="card-title">
          <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <span>Perfis e Usuários</span>
        </span>
        <button type="button" class="btn btn-outline" style="padding:5px 12px;" onclick="fecharModalUsuarios()">
          Fechar
        </button>
      </div>

      <div id="conteudoModalUsuarios"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
