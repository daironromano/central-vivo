<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autenticação Segura - Centralizador Vivo</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2d0047 0%, #660099 60%, #4a0070 100%);
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }
    .login-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--vivo-purple-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .login-header h2 {
      color: var(--vivo-purple);
      font-size: 21px;
      font-weight: 800;
    }
    .login-header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #f3f4f6;
      padding: 5px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .auth-tab-btn {
      border: none;
      background: transparent;
      padding: 9px 6px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .auth-tab-btn.active {
      background: #ffffff;
      color: var(--vivo-purple);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    .auth-panel {
      display: none;
    }
    .auth-panel.active {
      display: block;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }
    .form-group input:focus {
      outline: 2px solid var(--vivo-purple);
      border-color: transparent;
    }
    .btn-submit-full {
      width: 100%;
      background: var(--vivo-purple);
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-submit-full:hover {
      background: var(--vivo-purple-dark);
    }
    .msg-box {
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .msg-error {
      background: #f5ebf9;
      border-left: 4px solid #660099;
      color: #4a0070;
    }
    .msg-success {
      background: #f5ebf9;
      border-left: 4px solid #660099;
      color: #660099;
    }
    .auth-footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
    }
    .auth-link {
      background: none;
      border: none;
      color: var(--vivo-purple);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .auth-link:hover {
      text-decoration: underline;
    }
    .sec-note {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg class="icon-vivo" style="width: 30px; height: 30px;" viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
          </svg>
        </div>
        <h2>Centralizador Vivo</h2>
        <p>Arquitetura MVC · Segurança Corporativa Nível Avançado</p>
      </div>

      <!-- SELETOR DE MODO: ENTRAR / CRIAR USUÁRIO / RECUPERAR SENHA -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tabBtnLogin" onclick="alternarModoAuth('login')">
          <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>
          Entrar
        </button>
        <button type="button" class="auth-tab-btn" id="tabBtnRegister" onclick="alternarModoAuth('register')">
          <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          Criar Usuário
        </button>
        <button type="button" class="auth-tab-btn" id="tabBtnRecover" onclick="alternarModoAuth('recover')">
          <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
          Recuperar Senha
        </button>
      </div>

      <div id="msgBox" class="msg-box"></div>

      <!-- PAINEL 1: LOGIN -->
      <div id="panelLogin" class="auth-panel active">
        <form id="loginForm" onsubmit="fazerLogin(event)">
          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              Usuário
            </label>
            <input type="text" id="loginUsername" placeholder="Digite seu login" required autocomplete="username" />
          </div>

          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
              Senha
            </label>
            <input type="password" id="loginPassword" placeholder="Digite sua senha" required autocomplete="current-password" />
          </div>

          <button type="submit" class="btn-submit-full" id="btnLogin">
            <svg class="icon-vivo" style="fill: #ffffff;" viewBox="0 0 24 24">
              <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
            </svg>
            Entrar na Plataforma
          </button>
        </form>

        <div class="auth-footer-links">
          <button type="button" class="auth-link" onclick="alternarModoAuth('register')">
            <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Criar novo usuário
          </button>
          <button type="button" class="auth-link" onclick="alternarModoAuth('recover')">
            <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
            Esqueci minha senha
          </button>
        </div>
      </div>

      <!-- PAINEL 2: CRIAR USUÁRIO -->
      <div id="panelRegister" class="auth-panel">
        <form id="registerForm" onsubmit="fazerCadastro(event)">
          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              Login de Acesso
            </label>
            <input type="text" id="regUsername" placeholder="ex: joao.silva" required />
          </div>

          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
              Nome Completo
            </label>
            <input type="text" id="regNome" placeholder="Ex: João Silva" required />
          </div>

          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg>
              Senha (mín. 6 caracteres)
            </label>
            <input type="password" id="regPassword" placeholder="Crie uma senha forte" required />
          </div>

          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
              Palavra de Segurança (p/ Recuperar Senha)
            </label>
            <input type="password" id="regRecoveryKey" placeholder="Defina sua chave secreta de recuperação" required />
          </div>

          <button type="submit" class="btn-submit-full" id="btnRegister">
            <svg class="icon-vivo" style="fill: #ffffff;" viewBox="0 0 24 24">
              <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            Concluir Cadastro
          </button>
        </form>
      </div>

      <!-- PAINEL 3: RECUPERAR SENHA -->
      <div id="panelRecover" class="auth-panel">
        <form id="recoverForm" onsubmit="fazerRecuperacao(event)">
          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              Usuário
            </label>
            <input type="text" id="recUsername" placeholder="Digite seu login" required />
          </div>

          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
              Palavra de Segurança Cadastrada
            </label>
            <input type="password" id="recRecoveryKey" placeholder="Informe sua chave de recuperação" required />
          </div>

          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg>
              Nova Senha (mín. 6 caracteres)
            </label>
            <input type="password" id="recNewPassword" placeholder="Digite sua nova senha" required />
          </div>

          <button type="submit" class="btn-submit-full" id="btnRecover">
            <svg class="icon-vivo" style="fill: #ffffff;" viewBox="0 0 24 24">
              <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
            </svg>
            Redefinir Senha
          </button>
        </form>
      </div>

      <div class="sec-note">
        Protegido por Argon2id · Sessão Assinada HMAC-SHA256 · Rate-Limit Ativo
      </div>
    </div>
  </div>

  <script>
    function exibirMensagem(texto, tipo) {
      const box = document.getElementById('msgBox');
      box.textContent = texto;
      box.className = 'msg-box ' + (tipo === 'sucesso' ? 'msg-success' : 'msg-error');
      box.style.display = 'block';
    }

    function limparMensagem() {
      const box = document.getElementById('msgBox');
      box.style.display = 'none';
      box.textContent = '';
    }

    function alternarModoAuth(modo) {
      limparMensagem();
      document.getElementById('tabBtnLogin').classList.toggle('active', modo === 'login');
      document.getElementById('tabBtnRegister').classList.toggle('active', modo === 'register');
      document.getElementById('tabBtnRecover').classList.toggle('active', modo === 'recover');

      document.getElementById('panelLogin').classList.toggle('active', modo === 'login');
      document.getElementById('panelRegister').classList.toggle('active', modo === 'register');
      document.getElementById('panelRecover').classList.toggle('active', modo === 'recover');
    }

    async function fazerLogin(e) {
      e.preventDefault();
      limparMensagem();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUsername').value,
            password: document.getElementById('loginPassword').value
          })
        });
        const data = await res.json();
        if (data.sucesso) {
          window.location.href = '/';
        } else {
          exibirMensagem(data.erro || 'Falha na autenticação.', 'erro');
        }
      } catch (err) {
        exibirMensagem('Erro de conexão com o servidor.', 'erro');
      } finally {
        btn.disabled = false;
      }
    }

    async function fazerCadastro(e) {
      e.preventDefault();
      limparMensagem();
      const btn = document.getElementById('btnRegister');
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value,
            nome: document.getElementById('regNome').value,
            password: document.getElementById('regPassword').value,
            recovery_key: document.getElementById('regRecoveryKey').value
          })
        });
        const data = await res.json();
        if (data.sucesso) {
          const novoLogin = document.getElementById('regUsername').value;
          document.getElementById('registerForm').reset();
          alternarModoAuth('login');
          document.getElementById('loginUsername').value = novoLogin;
          exibirMensagem(data.mensagem, 'sucesso');
        } else {
          exibirMensagem(data.erro || 'Não foi possível criar o usuário.', 'erro');
        }
      } catch (err) {
        exibirMensagem('Erro de comunicação com o servidor.', 'erro');
      } finally {
        btn.disabled = false;
      }
    }

    async function fazerRecuperacao(e) {
      e.preventDefault();
      limparMensagem();
      const btn = document.getElementById('btnRecover');
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/recover', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('recUsername').value,
            recovery_key: document.getElementById('recRecoveryKey').value,
            new_password: document.getElementById('recNewPassword').value
          })
        });
        const data = await res.json();
        if (data.sucesso) {
          const recLogin = document.getElementById('recUsername').value;
          document.getElementById('recoverForm').reset();
          alternarModoAuth('login');
          document.getElementById('loginUsername').value = recLogin;
          exibirMensagem(data.mensagem, 'sucesso');
        } else {
          exibirMensagem(data.erro || 'Não foi possível redefinir a senha.', 'erro');
        }
      } catch (err) {
        exibirMensagem('Erro de comunicação com o servidor.', 'erro');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
