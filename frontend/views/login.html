<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centralizador Vivo</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2d0047 0%, #660099 60%, #4a0070 100%);
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--vivo-purple-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .login-header h2 {
      color: var(--vivo-purple);
      font-size: 20px;
      font-weight: 800;
    }
    .auth-panel {
      display: none;
    }
    .auth-panel.active {
      display: block;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }
    .form-group input:focus {
      outline: 2px solid var(--vivo-purple);
      border-color: transparent;
    }
    .btn-submit-full {
      width: 100%;
      background: var(--vivo-purple);
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-submit-full:hover {
      background: var(--vivo-purple-dark);
    }
    .msg-box {
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-bottom: 14px;
      font-weight: 600;
      background: #f5ebf9;
      border-left: 4px solid #660099;
      color: #4a0070;
    }
    .auth-footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
      font-size: 12.5px;
    }
    .auth-link {
      background: none;
      border: none;
      color: var(--vivo-purple);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .auth-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg class="icon-vivo" style="width: 28px; height: 28px;" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zm0 7.5l-6-3 6-3 6 3-6 3zm0 2.5l-10-5v2l10 5 10-5v-2l-10 5zm0 5l-10-5v2l10 5 10-5v-2l-10 5z"/>
          </svg>
        </div>
        <h2>Centralizador Vivo</h2>
      </div>

      <div id="msgBox" class="msg-box"></div>

      <!-- LOGIN -->
      <div id="panelLogin" class="auth-panel active">
        <form id="loginForm" onsubmit="fazerLogin(event)">
          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              Usuário
            </label>
            <input type="text" id="loginUsername" placeholder="Usuário" required autocomplete="username" />
          </div>

          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
              Senha
            </label>
            <input type="password" id="loginPassword" placeholder="Senha" required autocomplete="current-password" />
          </div>

          <button type="submit" class="btn-submit-full" id="btnLogin">
            <svg class="icon-vivo" style="fill: #ffffff;" viewBox="0 0 24 24">
              <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
            </svg>
            Entrar
          </button>
        </form>

        <div class="auth-footer-links">
          <button type="button" class="auth-link" onclick="alternarModoAuth('register')">
            Criar usuário
          </button>
          <button type="button" class="auth-link" onclick="alternarModoAuth('recover')">
            Recuperar senha
          </button>
        </div>
      </div>

      <!-- CRIAR USUÁRIO -->
      <div id="panelRegister" class="auth-panel">
        <form id="registerForm" onsubmit="fazerCadastro(event)">
          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              Usuário
            </label>
            <input type="text" id="regUsername" placeholder="Usuário" required />
          </div>

          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
              Nome
            </label>
            <input type="text" id="regNome" placeholder="Nome completo" required />
          </div>

          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg>
              Senha
            </label>
            <input type="password" id="regPassword" placeholder="Senha" required />
          </div>

          <button type="submit" class="btn-submit-full" id="btnRegister">
            Criar Usuário
          </button>
        </form>

        <div class="auth-footer-links">
          <button type="button" class="auth-link" onclick="alternarModoAuth('login')">
            Voltar ao login
          </button>
        </div>
      </div>

      <!-- RECUPERAR SENHA -->
      <div id="panelRecover" class="auth-panel">
        <form id="recoverForm" onsubmit="fazerRecuperacao(event)">
          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              Usuário
            </label>
            <input type="text" id="recUsername" placeholder="Usuário" required />
          </div>

          <div class="form-group">
            <label>
              <svg class="icon-vivo" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg>
              Nova Senha
            </label>
            <input type="password" id="recNewPassword" placeholder="Nova senha" required />
          </div>

          <button type="submit" class="btn-submit-full" id="btnRecover">
            Redefinir Senha
          </button>
        </form>

        <div class="auth-footer-links">
          <button type="button" class="auth-link" onclick="alternarModoAuth('login')">
            Voltar ao login
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function exibirMensagem(texto) {
      const box = document.getElementById('msgBox');
      box.textContent = texto;
      box.style.display = 'block';
    }

    function limparMensagem() {
      const box = document.getElementById('msgBox');
      box.style.display = 'none';
      box.textContent = '';
    }

    function alternarModoAuth(modo) {
      limparMensagem();
      document.getElementById('panelLogin').classList.toggle('active', modo === 'login');
      document.getElementById('panelRegister').classList.toggle('active', modo === 'register');
      document.getElementById('panelRecover').classList.toggle('active', modo === 'recover');
    }

    async function fazerLogin(e) {
      e.preventDefault();
      limparMensagem();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUsername').value,
            password: document.getElementById('loginPassword').value
          })
        });
        const data = await res.json();
        if (data.sucesso) {
          window.location.href = '/';
        } else {
          exibirMensagem(data.erro || 'Falha na autenticação.');
        }
      } catch (err) {
        exibirMensagem('Erro de conexão com o servidor.');
      } finally {
        btn.disabled = false;
      }
    }

    async function fazerCadastro(e) {
      e.preventDefault();
      limparMensagem();
      const btn = document.getElementById('btnRegister');
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value,
            nome: document.getElementById('regNome').value,
            password: document.getElementById('regPassword').value
          })
        });
        const data = await res.json();
        if (data.sucesso) {
          const novoLogin = document.getElementById('regUsername').value;
          document.getElementById('registerForm').reset();
          alternarModoAuth('login');
          document.getElementById('loginUsername').value = novoLogin;
          exibirMensagem(data.mensagem);
        } else {
          exibirMensagem(data.erro || 'Não foi possível criar o usuário.');
        }
      } catch (err) {
        exibirMensagem('Erro de comunicação com o servidor.');
      } finally {
        btn.disabled = false;
      }
    }

    async function fazerRecuperacao(e) {
      e.preventDefault();
      limparMensagem();
      const btn = document.getElementById('btnRecover');
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/recover', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('recUsername').value,
            new_password: document.getElementById('recNewPassword').value
          })
        });
        const data = await res.json();
        if (data.sucesso) {
          const recLogin = document.getElementById('recUsername').value;
          document.getElementById('recoverForm').reset();
          alternarModoAuth('login');
          document.getElementById('loginUsername').value = recLogin;
          exibirMensagem(data.mensagem);
        } else {
          exibirMensagem(data.erro || 'Não foi possível redefinir a senha.');
        }
      } catch (err) {
        exibirMensagem('Erro de comunicação com o servidor.');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
